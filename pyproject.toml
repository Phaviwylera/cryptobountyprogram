[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bountyscan"
version = "0.8.6"
description = "Find fund-loss bug candidates in Solidity DeFi contracts and draft responsible-disclosure reports."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
slither = ["slither-analyzer>=0.10"]

[project.scripts]
bountyscan = "bountyscan.cli:main"

[tool.setuptools]
packages = ["bountyscan"]
