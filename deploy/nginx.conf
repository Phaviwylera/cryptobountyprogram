# Reverse proxy for the bountyscan dashboard, with HTTP basic auth.
# The dashboard has no auth of its own, so NEVER expose port 8080 publicly - only nginx.

server {
    listen 80;
    server_name _;

    # Uncomment to force HTTPS once you have a cert (see deploy/README.md):
    # return 301 https://$host$request_uri;

    location / {
        auth_basic "bountyscan";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://bountyscan:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;        # long scans
    }
}

